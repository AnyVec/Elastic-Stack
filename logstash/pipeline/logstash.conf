# logstash/pipeline/logstash.conf

input {
  beats {
    port                        => 5044
    ssl_enabled                 => true
    ssl_certificate             => "/usr/share/logstash/certs/logstash/logstash.crt"
    ssl_key                     => "/usr/share/logstash/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_client_authentication   => "required"   # reject clients without a valid cert
  }

  tcp {
    port  => 5000
    codec => json_lines
    ssl_enabled                 => true
    ssl_certificate             => "/usr/share/logstash/certs/logstash/logstash.crt"
    ssl_key                     => "/usr/share/logstash/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_client_authentication   => "required"   # reject clients without a valid cert
  }
}

filter {
  # Example: parse classic syslog lines (only applies to events tagged with type => "syslog")
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    }
  }

  # Drop empty or health-check messages
  if [message] =~ /^\s*$/ {
    drop {}
  }

  # Keep [host]: Beats store useful host metadata there (host.name, host.os, ...)
  mutate {
    remove_field => ["@version"]
  }

  # Target index: Beats events carry [@metadata][beat], TCP events do not
  if [@metadata][beat] {
    mutate { add_field => { "[@metadata][target_index]" => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}" } }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "tcp-logs-%{+YYYY.MM.dd}" } }
  }
}

output {
  # Which user for which purpose?
  # - logstash_internal: dedicated user created by init-passwords (Step 6) with the custom
  #   logstash_writer role (write + create_index on *beat-* and tcp-logs-* only).
  #   Used HERE by the pipeline to create the indices and write your events.
  # - logstash_system: built-in reserved user, only meant for Logstash to store its OWN
  #   monitoring data (legacy internal monitoring, xpack.monitoring.* in logstash.yml).
  #   It cannot write to your indices: never use it in a pipeline output.
  #   Not needed in this guide, as legacy monitoring stays disabled (see logstash.yml).
  elasticsearch {
    hosts                       => ["https://elasticsearch:9200"]
    user                        => "logstash_internal"
    password                    => "${LOGSTASH_PASSWORD}"
    index                       => "%{[@metadata][target_index]}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_verification_mode       => "full"
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
