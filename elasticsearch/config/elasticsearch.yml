cluster.name: ${CLUSTER_NAME}
node.name: es01

# Network
network.host: 0.0.0.0
http.port: 9200

# Memory (requires memlock ulimits in docker-compose.yml)
bootstrap.memory_lock: true

# Cluster bootstrap
discovery.type: single-node

# Security (X-Pack)
xpack.security.enabled: true
xpack.security.http.ssl:
  enabled: true
  key: certs/elasticsearch/elasticsearch.key
  certificate: certs/elasticsearch/elasticsearch.crt
  certificate_authorities: certs/ca/ca.crt

xpack.security.transport.ssl:
  enabled: true
  key: certs/elasticsearch/elasticsearch.key
  certificate: certs/elasticsearch/elasticsearch.crt
  certificate_authorities: certs/ca/ca.crt
  verification_mode: full

# Monitoring
# Legacy self-monitoring (xpack.monitoring.collection.enabled) is deprecated since 7.16
# and scheduled for removal: use Metricbeat or Elastic Agent for Stack Monitoring instead

